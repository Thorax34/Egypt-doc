name: Render video
on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition id"
        default: "Prototype"
        required: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - run: npm install
      - run: npx remotion browser ensure
      - name: Render
        run: npx remotion render ${{ inputs.composition }} out/${{ inputs.composition }}.mp4 --codec=h264 --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.composition }}-mp4
          path: out/${{ inputs.composition }}.mp4
          retention-days: 7
